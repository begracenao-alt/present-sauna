<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a443b; --soft:#857d70; --cream:#fbf6ee; --cream2:#f1e6d4;
    --kraft:#eadcc4; --kraft2:#dcc9aa; --gold:#c6a466; --gold-deep:#a8843f;
    --serif:"Noto Serif JP",serif; --script:"Cormorant Garamond","Noto Serif JP",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{font-family:var(--serif);color:var(--ink);
    background:radial-gradient(120% 70% at 50% 0%,#fff 0%,var(--cream) 55%,var(--cream2) 100%);
    background-attachment:fixed;overflow-x:hidden}
  .frame{width:100%;max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 16px 40px;position:relative;text-align:center}
  .hide{display:none!important}
  .fade-in{animation:fadeIn 1s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .script{font-family:var(--script);font-style:italic;font-size:30px;color:var(--gold-deep);letter-spacing:.02em}
  .to{font-size:22px;font-weight:600;letter-spacing:.12em;margin-top:6px}
  .guide{font-size:15px;line-height:2;color:var(--soft);min-height:3.6em;margin-top:6px;transition:opacity .6s}
  .count{font-family:var(--script);font-style:italic;font-size:18px;color:var(--gold);height:24px;margin-top:2px}

  .btn{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.08em;border:none;cursor:pointer;
    padding:15px 38px;border-radius:999px;color:#fff;margin-top:18px;
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));box-shadow:0 12px 26px -12px rgba(150,120,60,.7)}
  .btn:active{transform:scale(.96)}
  .link{background:none;border:none;font-family:var(--serif);font-size:12.5px;color:var(--soft);
    margin-top:14px;padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#d9ccb6}

  /* 箱 */
  .stage{position:relative;width:240px;height:250px;margin:26px auto 8px}
  .halo{position:absolute;left:50%;top:58%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,236,190,.75) 0%,rgba(255,236,190,0) 68%);
    transform:scale(.8);opacity:.5;transition:transform 4s ease-in-out,opacity 4s ease-in-out}
  .box{position:absolute;left:50%;bottom:0;width:180px;height:180px;margin-left:-90px;
    transform-origin:50% 100%;transition:transform 4s ease-in-out;cursor:pointer}
  .box.ready{animation:wiggle 2.4s ease-in-out infinite}
  @keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-3deg)}82%{transform:rotate(3deg)}88%{transform:rotate(-2deg)}94%{transform:rotate(1deg)}}
  .body{position:absolute;left:0;right:0;bottom:0;height:136px;border-radius:6px;
    background:linear-gradient(180deg,var(--kraft) 0%,var(--kraft2) 100%);box-shadow:0 18px 30px -18px rgba(120,90,40,.55)}
  .body::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold) 45%,#e6cd96 55%,var(--gold-deep))}
  .lid{position:absolute;left:-10px;right:-10px;bottom:130px;height:42px;border-radius:6px;z-index:3;
    background:linear-gradient(180deg,#f2e6d2 0%,var(--kraft) 100%);box-shadow:0 6px 10px -6px rgba(120,90,40,.45);
    transition:transform 1.1s cubic-bezier(.3,1.4,.5,1),opacity 1.1s ease}
  .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:24px;margin-left:-12px;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold) 45%,#e6cd96 55%,var(--gold-deep))}
  .bow{position:absolute;left:50%;top:-34px;width:0;height:0;transition:transform .9s ease,opacity .9s ease}
  .bow span{position:absolute;width:52px;height:34px;border:7px solid var(--gold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    top:0;background:rgba(255,240,205,.35)}
  .bow .l{right:2px;transform:rotate(-22deg);transform-origin:right bottom}
  .bow .r{left:2px;transform:rotate(22deg);transform-origin:left bottom}
  .bow .k{width:20px;height:20px;border:none;border-radius:50%;left:-10px;top:20px;
    background:radial-gradient(circle at 35% 35%,#ecd6a4,var(--gold-deep))}
  .glow{position:absolute;left:50%;bottom:120px;width:10px;height:10px;margin-left:-5px;border-radius:50%;
    box-shadow:0 0 0 0 rgba(255,232,170,0);opacity:0;transition:all 1.2s ease}

  .box.open .bow{transform:translateY(-60px) scale(.6);opacity:0}
  .box.open .lid{transform:translate(70px,-150px) rotate(28deg);opacity:0}
  .box.open .glow{opacity:1;box-shadow:0 0 70px 50px rgba(255,232,170,.95)}

  /* 光の粒 */
  .spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:20;
    background:radial-gradient(circle,#fff6dc 0%,#e8c77e 55%,rgba(232,199,126,0) 75%)}
  .petal{position:fixed;width:7px;height:12px;border-radius:2px;pointer-events:none;z-index:20}

  /* カード */
  .card-wrap{width:100%;max-width:440px}
  .card{width:100%;display:block;border-radius:14px;box-shadow:0 24px 50px -24px rgba(90,70,30,.55);
    animation:rise 1.4s cubic-bezier(.2,.9,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(120px) scale(.6)}to{opacity:1;transform:none}}
  .msg{font-size:18px;font-weight:500;line-height:2;letter-spacing:.06em;color:var(--ink);margin:30px 0 4px;
    animation:fadeIn 1.4s 1.2s ease both}
  .msg small{display:block;font-family:var(--script);font-style:italic;font-size:22px;color:var(--gold-deep);letter-spacing:.02em}
  .float{position:fixed;bottom:-20px;width:6px;height:6px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#fff6dc 0%,#e8c77e 60%,rgba(232,199,126,0) 75%);animation:up linear forwards}
  @keyframes up{to{transform:translateY(-110vh);opacity:0}}
  @media (prefers-reduced-motion:reduce){.box,.halo,.lid,.bow{transition-duration:.01s!important}.card{animation:none}}
</style>
</head>
<body>
<main class="frame" id="first">
  <div class="script fade-in">for you</div>
  <div class="to fade-in">しのぶさんへ</div>

  <div class="stage fade-in">
    <div class="halo" id="halo"></div>
    <div class="box" id="box" aria-label="プレゼントの箱">
      <div class="glow"></div>
      <div class="body"></div>
      <div class="lid"><div class="bow"><span class="l"></span><span class="r"></span><span class="k"></span></div></div>
    </div>
  </div>

  <p class="guide fade-in" id="guide">開ける前に、<br>ゆっくり深呼吸を3回しましょう。</p>
  <div class="count" id="count"></div>
  <button class="btn fade-in" id="start">深呼吸する</button>
  <button class="link fade-in" id="skip">このまま開ける</button>
</main>

<main class="frame hide" id="gift">
  <div class="card-wrap">
    <img class="card" src="card.jpg" alt="Happy Birthday 今年のプレゼントは、ふたりで、ととのう3時間 IZA SAUNA osaka">
    <p class="msg">ますます最高の1年に<br>なりますように♡<small>Happy Birthday</small></p>
    <button class="link" id="again">もう一度ひらく</button>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const box=$('box'),halo=$('halo'),guide=$('guide'),count=$('count');
let state='idle',timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const IN=4000,OUT=5000;

function setGuide(t){guide.style.opacity=0;setTimeout(()=>{guide.innerHTML=t;guide.style.opacity=1},300)}

function breathe(n){
  if(n>3){ready();return}
  count.textContent=n+' / 3';
  setGuide('吸って…');
  box.style.transitionDuration=halo.style.transitionDuration=(IN/1000)+'s';
  box.style.transform='scale(1.12)';halo.style.transform='scale(1.15)';halo.style.opacity='1';
  later(()=>{
    setGuide('ゆっくり、吐いて…');
    box.style.transitionDuration=halo.style.transitionDuration=(OUT/1000)+'s';
    box.style.transform='scale(1)';halo.style.transform='scale(.8)';halo.style.opacity='.5';
    later(()=>breathe(n+1),OUT);
  },IN);
}

function ready(){
  state='ready';count.textContent='';
  box.style.transitionDuration='.4s';box.style.transform='';
  setGuide('さあ、箱をタップして<br>開けてみてね');
  box.classList.add('ready');
}

$('start').onclick=()=>{
  if(state!=='idle')return;state='breathing';
  $('start').classList.add('hide');$('skip').classList.add('hide');
  breathe(1);
};
$('skip').onclick=()=>{
  if(state!=='idle')return;
  $('start').classList.add('hide');$('skip').classList.add('hide');ready();
};
box.onclick=()=>{if(state==='ready')openBox()};

function openBox(){
  state='opening';box.classList.remove('ready');box.classList.add('open');
  setGuide('');count.textContent='';
  const r=box.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.3;
  later(()=>burst(cx,cy),350);
  later(()=>{
    $('first').classList.add('hide');$('gift').classList.remove('hide');
    window.scrollTo(0,0);floaty();
  },1900);
}

function burst(cx,cy){
  const colors=['#e8c77e','#f3dfae','#c6a466','#f7e9c8','#e9b9a8'];
  for(let i=0;i<46;i++){
    const s=document.createElement('div');
    const petal=i%3===0;
    s.className=petal?'petal':'spark';
    if(petal)s.style.background=colors[i%colors.length];
    s.style.left=cx+'px';s.style.top=cy+'px';
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=90+Math.random()*170;
    const dx=Math.cos(a)*d,dy=Math.sin(a)*d-80;
    s.animate([
      {transform:'translate(-50%,-50%) scale(.4) rotate(0deg)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(${.8+Math.random()}) rotate(${Math.random()*360}deg)`,opacity:1,offset:.6},
      {transform:`translate(${dx*1.1}px,${dy+140}px) scale(.6) rotate(${Math.random()*540}deg)`,opacity:0}
    ],{duration:1600+Math.random()*900,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'}).onfinish=()=>s.remove();
  }
}

let floatTimer;
function floaty(){
  let k=0;clearInterval(floatTimer);
  floatTimer=setInterval(()=>{
    if(++k>40){clearInterval(floatTimer);return}
    const f=document.createElement('div');f.className='float';
    f.style.left=Math.random()*100+'vw';
    f.style.animationDuration=(7+Math.random()*6)+'s';
    f.style.opacity=.5+Math.random()*.5;
    document.body.appendChild(f);setTimeout(()=>f.remove(),14000);
  },450);
}

$('again').onclick=()=>{
  timers.forEach(clearTimeout);timers=[];clearInterval(floatTimer);
  state='idle';box.classList.remove('open','ready');box.style.transform='';
  halo.style.transform='scale(.8)';halo.style.opacity='.5';
  guide.innerHTML='開ける前に、<br>ゆっくり深呼吸を3回しましょう。';count.textContent='';
  $('start').classList.remove('hide');$('skip').classList.remove('hide');
  $('gift').classList.add('hide');$('first').classList.remove('hide');window.scrollTo(0,0);
};
</script>
</body>
</html>
